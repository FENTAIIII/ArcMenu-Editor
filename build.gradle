buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.17.20' }
}

apply plugin: project.minecraft_version.startsWith('1.') ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'
apply from: 'gradle/compatibility.gradle'
apply from: 'gradle/embedded-aui.gradle'

def editorVersion = providers.gradleProperty('mod_version').get()
version = editorVersion
group = providers.gradleProperty('maven_group').get()

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

// Compile against the single-@At Redirect API so the JAR also works with
// MixinExtras 0.5.4 and earlier. Newer Mixin accepts this format as well.
// Leave the game's runtime Mixin and MixinExtras versions under Loader's control.
configurations.named('compileClasspath') {
    resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.minecraft_version.startsWith('1.')) mappings loom.officialMojangMappings()
    if (project.minecraft_version.startsWith('1.')) {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${targetFabricVersion}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${targetFabricVersion}"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

processResources {
    inputs.property 'version', editorVersion
    inputs.property 'minecraft', project.minecraft_version
    inputs.property 'java', targetJavaVersion
    filesMatching('fabric.mod.json') {
        expand version: editorVersion, minecraft: project.minecraft_version, java: targetJavaVersion
    }
    filesMatching('arcmenu-editor.mixins.json') {
        expand java: targetJavaVersion
        if (usesModernRenderer) filter { it.replace('"GameRendererMixin"', '"GameRendererMixin", "HudMixin"') }
        filter { it.replace('"GameRendererMixin"', '"' + (project.minecraft_version == '26.3' ? 'VisionLevelExtractorMixin' : 'VisionEntityRenderDispatcherMixin') + '", "GameRendererMixin"') }
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_arcmenu-editor.txt' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

def runtimeJar = tasks.named(project.minecraft_version.startsWith('1.') ? 'remapJar' : 'jar')

tasks.named('test') {
    dependsOn runtimeJar
    inputs.file(runtimeJar.flatMap { it.archiveFile })
    systemProperty 'arcmenu.runtimeJar', runtimeJar.get().archiveFile.get().asFile.absolutePath
}
tasks.register('verifyNoBundledLwjgl') {
    dependsOn runtimeJar
    inputs.file(runtimeJar.flatMap { it.archiveFile })
    doLast {
        def libraries = zipTree(runtimeJar.get().archiveFile.get()).matching {
            include 'META-INF/jars/lwjgl*.jar', 'org/lwjgl/**'
        }
        if (!libraries.isEmpty()) throw new GradleException('The editor must use Minecraft\'s LWJGL runtime without bundling replacement classes.')
    }
}
tasks.named('check') { dependsOn 'verifyNoBundledLwjgl' }

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
