// Shared editor sources use the 26.1 API vocabulary. Mechanical API renames
// happen at build time; behavioral differences live in src/compat.
def versions = new Properties()
file('gradle/minecraft-versions.properties').withInputStream { versions.load(it) }
def target = project.minecraft_version.toString()
if (!versions.containsKey(target)) throw new GradleException("Unsupported Minecraft target: ${target}; choose ${versions.keySet().sort()}")
ext.targetFabricVersion = versions.getProperty(target)
ext.targetJavaVersion = target.startsWith('1.') ? 21 : 25
ext.usesModernRenderer = target in ['26.2', '26.3']
def old = target.startsWith('1.')
layout.buildDirectory = file("build/${target}")

def generated = layout.buildDirectory.dir('generated/sources/compat/main')
def prepare = tasks.register('prepareVersionSources', Sync) {
    inputs.property('minecraft', target)
    inputs.file('gradle/compatibility.gradle')
    into generated
    from('src/main/java') {
        if (old || usesModernRenderer) exclude '**/EditorWorldCompositor.java'
        if (old) exclude '**/mixin/CameraMixin.java', '**/mixin/GameRendererMixin.java'
        if (target == '26.3') exclude '**/VisionTextInput.java'
        if (usesModernRenderer) exclude '**/mixin/GameRendererMixin.java'
        filter { String line ->
            if (usesModernRenderer) line = line.replace('return client.options.hideGui;', 'return client.gui.hud.isHidden();').replace('client.options.hideGui=value;', 'if(client.gui.hud.isHidden()!=value)client.gui.hud.toggle();').replace('import net.minecraft.client.gui.Gui;', 'import net.minecraft.client.gui.Hud;').replace('@Mixin(Gui.class)', '@Mixin(Hud.class)')
            if (target == '26.3') line = line.replace('import org.lwjgl.glfw.GLFW;', 'import com.mojang.blaze3d.platform.InputConstants;').replace('GLFW.GLFW_', 'InputConstants.').replace('InputConstants.KEY_ENTER', 'InputConstants.KEY_RETURN').replace('InputConstants.KEY_EQUAL', 'InputConstants.KEY_EQUALS').replace('InputConstants.KEY_LEFT_BRACKET', 'InputConstants.KEY_LBRACKET').replace('InputConstants.KEY_RIGHT_BRACKET', 'InputConstants.KEY_RBRACKET').replace('InputConstants.KEY_PAGE_UP', 'InputConstants.KEY_PAGEUP').replace('InputConstants.KEY_PAGE_DOWN', 'InputConstants.KEY_PAGEDOWN').replace('InputConstants.KEY_KP_0', 'InputConstants.KEY_NUMPAD0').replace('InputConstants.KEY_KP_ADD', 'InputConstants.KEY_ADD').replace('InputConstants.KEY_KP_SUBTRACT', '86')
            if (target == '26.3') line = line.replace('InputConstants.isKeyDown(minecraft.getWindow(),', 'InputConstants.isKeyDown(')
            if (usesModernRenderer) line = line.replace('client.gameRenderer.getMainCamera()', 'client.gameRenderer.mainCamera()')
            if (usesModernRenderer) line = line.replace('client.screen', 'client.gui.screen()').replace('minecraft.screen', 'minecraft.gui.screen()').replace('client.setScreen(', 'client.gui.setScreen(').replace('minecraft.setScreen(', 'minecraft.gui.setScreen(').replace('client.getMainRenderTarget()', 'client.gameRenderer.mainRenderTarget()')
            if (usesModernRenderer) line = line.replace('client.gameRenderer.getLighting()', 'client.gameRenderer.lighting()')
            if (target == '26.3') line = line.replace('pose.mulPose(', 'pose.rotate(')
            if (!usesModernRenderer) {
                line = line.replace('public VisionSceneRenderer(EntityRenderDispatcher dispatcher) { this.dispatcher = dispatcher; }',
                        'public VisionSceneRenderer(EntityRenderDispatcher dispatcher) { super(Minecraft.getInstance().renderBuffers().bufferSource()); this.dispatcher = dispatcher; }')
                        .replace('renderToTexture(VisionSceneRenderState state, PoseStack pose, SubmitNodeCollector collector)',
                                'renderToTexture(VisionSceneRenderState state, PoseStack pose)')
                        .replace('        submitScene(state, pose, collector);',
                                '        var features = Minecraft.getInstance().gameRenderer.getFeatureRenderDispatcher();\n        submitScene(state, pose, features.getSubmitNodeStorage());\n        features.renderAllFeatures();')
            }
            if (!old) return line
            if (line.contains('camera.xRot =') || line.contains('camera.yRot =')) return ''
            return line.replace('GuiGraphicsExtractor', 'GuiGraphics')
                    .replace('extractRenderState', 'render').replace('extractBackground', 'renderBackground')
                    .replace('extractCrosshair', 'renderCrosshair')
                    .replace('graphics.text(', 'graphics.drawString(')
                    .replace('graphics.centeredText(', 'graphics.drawCenteredString(')
                    .replace('graphics.outline(', 'graphics.renderOutline(')
                    .replace('g.text(', 'g.drawString(').replace('g.centeredText(', 'g.drawCenteredString(')
                    .replace('g.outline(', 'g.renderOutline(')
                    .replace('PayloadTypeRegistry.serverboundPlay()', 'PayloadTypeRegistry.playC2S()')
                    .replace('PayloadTypeRegistry.clientboundPlay()', 'PayloadTypeRegistry.playS2C()')
                    .replace('net.minecraft.client.renderer.state.gui.', 'net.minecraft.client.gui.render.state.')
                    .replace('net.minecraft.client.renderer.state.level.CameraRenderState', 'net.minecraft.client.renderer.state.CameraRenderState')
                    .replace('ProjectionMatrixBuffer', 'PerspectiveProjectionMatrixBuffer')
                    .replace('import net.minecraft.client.renderer.Projection;', 'import org.joml.Matrix4f;')
                    .replace('Projection projection = new Projection()', 'Matrix4f projection = new Matrix4f()')
                    .replace('projection.setupPerspective(.05f, 1024f, scene.verticalFov(), state.viewport().width(), state.viewport().height());',
                            'projection.setPerspective((float) Math.toRadians(scene.verticalFov()), state.viewport().width() / (float) state.viewport().height(), .05f, 1024f);')
                    .replace('addPicturesInPictureState(', 'submitPicturesInPictureState(')
                    .replace('camera.orientation.set(orientation);', 'camera.orientation = orientation;')
        }
    }
    if (old) from('src/compat/legacy-render/java')
    from(target == '26.3' ? 'src/compat/26.3/java' : 'src/compat/glfw/java') {
        filter { String line ->
            if (old) return line.replace('GuiGraphicsExtractor', 'GuiGraphics')
            return line
        }
    }
    if (usesModernRenderer) from('src/compat/26.2/java') {
        filter { String line ->
            if (target != '26.3') return line
            return line.replace('false, main.getColorTexture().getFormat()', 'main.getColorTexture().getFormat(), null')
                    .replace('withSampler("InSampler")', 'withUniform("InSampler", UniformType.COMBINED_IMAGE_SAMPLER)')
                    .replace('pass.setPipeline(VIEWPORT_BLIT)', 'pass.setPipeline(RenderSystem.getCompiledPipeline(VIEWPORT_BLIT))')
                    .replace('pass.bindTexture(', 'pass.setUniform(')
                    .replace('com.mojang.blaze3d.PrimitiveTopology', 'com.mojang.renderpearl.api.pipeline.PrimitiveTopology')
                    .replace('com.mojang.blaze3d.buffers.GpuBuffer', 'com.mojang.renderpearl.api.buffers.GpuBuffer')
                    .replace('com.mojang.blaze3d.pipeline.BindGroupLayout', 'com.mojang.renderpearl.api.pipeline.BindGroupLayout')
                    .replace('com.mojang.blaze3d.pipeline.ColorTargetState', 'com.mojang.renderpearl.api.pipeline.ColorTargetState')
                    .replace('com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline')
                    .replace('com.mojang.blaze3d.shaders.UniformType', 'com.mojang.renderpearl.api.pipeline.UniformType')
                    .replace('com.mojang.blaze3d.textures.FilterMode', 'com.mojang.renderpearl.api.textures.FilterMode')
                    .replace('com/mojang/blaze3d/systems/CommandEncoder', 'com/mojang/renderpearl/api/commands/CommandEncoder')
                    .replace('com/mojang/blaze3d/textures/GpuTexture', 'com/mojang/renderpearl/api/textures/GpuTexture')
        }
    }
}
sourceSets.main.java.setSrcDirs([generated])
if (target == '26.3') sourceSets.test.java.srcDir('src/compat/26.3/test/java')
if (usesModernRenderer) {
    sourceSets.main.resources.srcDir('src/compat/26.2/resources')
    sourceSets.test.java.srcDir('src/compat/26.2/test/java')
}
tasks.named('compileJava') { dependsOn prepare }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn prepare }
