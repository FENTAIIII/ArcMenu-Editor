// Shared editor sources use the 26.1 API vocabulary. Mechanical API renames
// happen at build time; behavioral differences live in src/compat.
def versions = new Properties()
file('gradle/minecraft-versions.properties').withInputStream { versions.load(it) }
def target = project.minecraft_version.toString()
if (!versions.containsKey(target)) throw new GradleException("Unsupported Minecraft target: ${target}; choose ${versions.keySet().sort()}")
ext.targetFabricVersion = versions.getProperty(target)
ext.targetJavaVersion = target.startsWith('1.') ? 21 : 25
ext.usesModernRenderer = target in ['26.2', '26.3']
def old = target.startsWith('1.')
def patch = old ? target.tokenize('.')[2].toInteger() : 0
layout.buildDirectory = file("build/${target}")

def generated = layout.buildDirectory.dir('generated/sources/compat/main')
def prepare = tasks.register('prepareVersionSources', Sync) {
    inputs.property('minecraft', target)
    inputs.file('gradle/compatibility.gradle')
    into generated
    from('src/main/java') {
        if (old || usesModernRenderer) exclude '**/EditorWorldCompositor.java'
        if (old) exclude '**/mixin/CameraMixin.java', '**/mixin/GameRendererMixin.java'
        if (old) exclude '**/VisionCursorClient.java', '**/mixin/Vision*Mixin.java'
        if (usesModernRenderer) exclude '**/mixin/GameRendererMixin.java'
        filter { String line ->
            if (usesModernRenderer) line = line.replace('return client.options.hideGui;', 'return client.gui.hud.isHidden();').replace('client.options.hideGui=value;', 'if(client.gui.hud.isHidden()!=value)client.gui.hud.toggle();')
            if (target == '26.3') line = line.replace('import org.lwjgl.glfw.GLFW;', 'import com.mojang.blaze3d.platform.InputConstants;').replace('GLFW.GLFW_', 'InputConstants.').replace('InputConstants.KEY_ENTER', 'InputConstants.KEY_RETURN').replace('InputConstants.KEY_EQUAL', 'InputConstants.KEY_EQUALS').replace('InputConstants.KEY_LEFT_BRACKET', 'InputConstants.KEY_LBRACKET').replace('InputConstants.KEY_RIGHT_BRACKET', 'InputConstants.KEY_RBRACKET').replace('InputConstants.KEY_PAGE_UP', 'InputConstants.KEY_PAGEUP').replace('InputConstants.KEY_PAGE_DOWN', 'InputConstants.KEY_PAGEDOWN').replace('InputConstants.KEY_KP_0', 'InputConstants.KEY_NUMPAD0').replace('InputConstants.KEY_KP_ADD', 'InputConstants.KEY_ADD').replace('InputConstants.KEY_KP_SUBTRACT', '86')
            if (target == '26.3') line = line.replace('InputConstants.isKeyDown(minecraft.getWindow(),', 'InputConstants.isKeyDown(')
            if (usesModernRenderer) line = line.replace('client.gameRenderer.getMainCamera()', 'client.gameRenderer.mainCamera()')
            if (usesModernRenderer) return line.replace('client.screen', 'client.gui.screen()').replace('minecraft.screen', 'minecraft.gui.screen()').replace('client.setScreen(', 'client.gui.setScreen(').replace('minecraft.setScreen(', 'minecraft.gui.setScreen(').replace('client.getMainRenderTarget()', 'client.gameRenderer.mainRenderTarget()')
            if (!old) return line
            if (patch <= 8 && line == 'import net.minecraft.client.gui.screens.Screen;') line += '\nimport com.fentai.arcmenu.editor.compat.LegacyScreen;'
            if (patch <= 5 && line.contains('return MultiLineEditBox.builder()')) return '        return new MultiLineEditBox(font,x,y,w,h,EditorI18n.component("arcmenu_editor.market.description_hint"),EditorI18n.component("arcmenu_editor.projects.field.description"));'
            if (patch <= 8) line = line.replace('client.services().sessionService().joinServer(', 'client.getMinecraftSessionService().joinServer(')
            if (patch <= 4) line = line.replace('new DynamicTexture(()->"ArcMenu marketplace preview",image)', 'new DynamicTexture(image)')
            if (patch == 1) line = line.replace('output.setPixel(ox+px,oy+py,crop.getPixel(px,py))', 'output.setPixelRGBA(ox+px,oy+py,crop.getPixelRGBA(px,py))')
            if (patch <= 8 && line.contains('import net.minecraft.client.input.MouseButtonInfo;')) return ''
            if (patch <= 8 && line.contains('private static MouseButtonEvent mouseEvent')) return '    private static MouseButtonEvent mouseEvent(double x,double y,int button,int mods){return new MouseButtonEvent(x,y,button,mods);}'
            if (patch <= 8) line = line.replace('var input=minecraft.screen instanceof EffectWorkspaceChild child&&child.workspace()==this?minecraft.screen:this;', 'var input=minecraft.screen instanceof LegacyScreen legacy&&minecraft.screen instanceof EffectWorkspaceChild child&&child.workspace()==this?legacy:this;')
            if (patch <= 8 && line.contains('import net.minecraft.network.chat.FontDescription;')) return ''
            if (patch <= 8) line = line.replace('FontDescription.Resource', 'Identifier').replace('new Identifier(Identifier.fromNamespaceAndPath(', 'Identifier.fromNamespaceAndPath(').replace('"effect_ui"));', '"effect_ui");').replace('"effect_mono"));', '"effect_mono");')
            if (patch <= 4) line = line.replace('Screenshot.takeScreenshot(client.getMainRenderTarget(), value -> { if (!image.complete(value)) value.close(); });', 'image.complete(Screenshot.takeScreenshot(client.getMainRenderTarget()));')
            if (patch <= 8) line = line.replace('InputConstants.isKeyDown(minecraft.getWindow(),', 'InputConstants.isKeyDown(minecraft.getWindow().getWindow(),').replace('.addFormatter(', '.setFormatter(')
            if (patch <= 8) line = line.replace('searchField.mouseClicked(event, doubleClick)', 'searchField.mouseClicked(event.x(), event.y(), event.button())').replace('projectSearch.mouseClicked(e,doubleClick)', 'projectSearch.mouseClicked(e.x(),e.y(),e.button())').replace('f.box.mouseClicked(e,doubleClick)', 'f.box.mouseClicked(e.x(),e.y(),e.button())')
            line = line.replace('GuiGraphicsExtractor', 'GuiGraphics')
                    .replace('extractRenderState', 'render').replace('extractBackground', 'renderBackground')
                    .replace('graphics.text(', 'graphics.drawString(')
                    .replace('graphics.centeredText(', 'graphics.drawCenteredString(')
                    .replace('graphics.outline(', patch == 9 || patch == 10 ? 'graphics.submitOutline(' : 'graphics.renderOutline(')
                    .replace('g.text(', 'g.drawString(').replace('g.centeredText(', 'g.drawCenteredString(')
                    .replace('g.outline(', patch == 9 || patch == 10 ? 'g.submitOutline(' : 'g.renderOutline(')
                    .replace('PayloadTypeRegistry.serverboundPlay()', 'PayloadTypeRegistry.playC2S()')
                    .replace('PayloadTypeRegistry.clientboundPlay()', 'PayloadTypeRegistry.playS2C()')
            if (patch <= 10) line = line.replace('Identifier', 'ResourceLocation')
            if (patch <= 5) line = line.replace('box.setTextShadow(false);', '').replace('search.setTextShadow(false);', '')
            if (patch == 1) {
                if (line.contains('graphics.blit(RenderPipelines.GUI_TEXTURED, texture,')) {
                    return '        graphics.blit(texture, fit.x(), fit.y(), fit.width(), fit.height(), 0f, 0f,'
                }
                if (line.contains('fit.width(), fit.height(), image.width(), image.height(), image.width(), image.height());')) {
                    return '                image.width(), image.height(), image.width(), image.height());'
                }
                if (line.contains('graphics.blit(RenderPipelines.GUI_TEXTURED, ATLAS')) {
                    return '        graphics.setColor(((color >> 16) & 255) / 255f, ((color >> 8) & 255) / 255f, (color & 255) / 255f, ((color >>> 24) & 255) / 255f);\n' +
                            '        graphics.blit(ATLAS, x, y, icon.u(), icon.v(), icon.width(), icon.height(), 256, 256);\n' +
                            '        graphics.setColor(1, 1, 1, 1);'
                }
                if (line.contains('icon.width(), icon.height(), icon.width(), icon.height(), 256, 256, color);')) return ''
            }
            if (patch <= 8) {
                line = line.replace('net.minecraft.client.input.KeyEvent', 'com.fentai.arcmenu.editor.compat.KeyEvent')
                        .replace('net.minecraft.client.input.CharacterEvent', 'com.fentai.arcmenu.editor.compat.CharacterEvent')
                        .replace('net.minecraft.client.input.MouseButtonEvent', 'com.fentai.arcmenu.editor.compat.MouseButtonEvent')
                        .replace('extends Screen', 'extends LegacyScreen')
            }
            if (patch <= 5) {
                line = line.replace('import net.minecraft.client.renderer.RenderPipelines;', 'import net.minecraft.client.renderer.RenderType;')
                if (patch == 1) line = line.replace('RenderPipelines.GUI_TEXTURED, ', '')
                else line = line.replace('RenderPipelines.GUI_TEXTURED', 'RenderType::guiTextured')
            }
            return line
        }
    }
    if (old) {
        from('src/compat/legacy-vision/java')
        from('src/compat/legacy-render/java') {
            filter { String line ->
                if (patch <= 4) {
                    if (line == 'import com.mojang.blaze3d.opengl.GlTexture;') return ''
                    return line.replace('((GlTexture) main.getColorTexture()).glId()', 'main.getColorTextureId()')
                        .replace('Lcom/mojang/blaze3d/systems/CommandEncoder;clearDepthTexture(Lcom/mojang/blaze3d/textures/GpuTexture;D)V',
                                patch == 1 ? 'Lcom/mojang/blaze3d/systems/RenderSystem;clear(IZ)V' : 'Lcom/mojang/blaze3d/systems/RenderSystem;clear(I)V')
                }
                return line
            }
        }
        if (patch <= 8) from('src/compat/legacy-input/java')
    }
    if (target == '26.3') from('src/compat/26.3/java')
    else if (!old) from('src/compat/legacy-scene/java')
    if (usesModernRenderer) from('src/compat/26.2/java') {
        filter { String line ->
            if (target != '26.3') return line
            return line.replace('false, main.getColorTexture().getFormat()', 'main.getColorTexture().getFormat(), null')
                    .replace('withSampler("InSampler")', 'withUniform("InSampler", UniformType.COMBINED_IMAGE_SAMPLER)')
                    .replace('pass.setPipeline(VIEWPORT_BLIT)', 'pass.setPipeline(RenderSystem.getCompiledPipeline(VIEWPORT_BLIT))')
                    .replace('pass.bindTexture(', 'pass.setUniform(')
                    .replace('com.mojang.blaze3d.PrimitiveTopology', 'com.mojang.renderpearl.api.pipeline.PrimitiveTopology')
                    .replace('com.mojang.blaze3d.buffers.GpuBuffer', 'com.mojang.renderpearl.api.buffers.GpuBuffer')
                    .replace('com.mojang.blaze3d.pipeline.BindGroupLayout', 'com.mojang.renderpearl.api.pipeline.BindGroupLayout')
                    .replace('com.mojang.blaze3d.pipeline.ColorTargetState', 'com.mojang.renderpearl.api.pipeline.ColorTargetState')
                    .replace('com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline')
                    .replace('com.mojang.blaze3d.shaders.UniformType', 'com.mojang.renderpearl.api.pipeline.UniformType')
                    .replace('com.mojang.blaze3d.textures.FilterMode', 'com.mojang.renderpearl.api.textures.FilterMode')
                    .replace('com/mojang/blaze3d/systems/CommandEncoder', 'com/mojang/renderpearl/api/commands/CommandEncoder')
                    .replace('com/mojang/blaze3d/textures/GpuTexture', 'com/mojang/renderpearl/api/textures/GpuTexture')
        }
    }
}
sourceSets.main.java.setSrcDirs([generated])
if (target == '26.3') sourceSets.test.java.srcDir('src/compat/26.3/test/java')
if (usesModernRenderer) {
    sourceSets.main.resources.srcDir('src/compat/26.2/resources')
    sourceSets.test.java.srcDir('src/compat/26.2/test/java')
}
tasks.named('compileJava') { dependsOn prepare }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn prepare }
