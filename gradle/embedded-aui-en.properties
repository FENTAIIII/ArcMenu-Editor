# English replacements for upstream library diagnostics in the embedded runtime.
下载失败=Download failed
下载超时=Download timed out
资源超出大小限制(8MB)=Resource exceeds the size limit (8 MB)
重定向次数超限=Too many redirects
重定向缺失\ Location=Redirect is missing Location
重定向目标非\ HTTPS，已拒绝=Redirect target is not HTTPS and was rejected
远程资源类型不支持=Unsupported remote resource type
下载线程被中断=Download thread was interrupted
远程资源为空=Remote resource is empty
仅允许\ HTTPS\ 远程资源=Only HTTPS remote resources are allowed
等待远程资源结果被中断=Waiting for the remote resource was interrupted
远程资源结果为空=Remote resource result is empty
图片解码失败=Image decoding failed
未找到图片资源=Image resource was not found
上传纹理失败=Texture upload failed
图片尺寸非法=Invalid image dimensions
推导后的帧尺寸非法=Invalid derived frame dimensions
Sprite\ 帧尺寸推导失败：=Sprite frame dimensions could not be derived:
未找到音频资源=Audio resource was not found
音频解码失败=Audio decoding failed
音频后端不可用=Audio backend is unavailable
文件为空或读取失败=The file is empty or could not be read
不支持的音频格式（仅支持\ OGG\ Vorbis\ /\ WAV\ PCM）=Unsupported audio format (only OGG Vorbis / WAV PCM are supported)
WAV\ 解码失败：仅支持\ PCM（format\ 1）、1-2\ 声道、8/16-bit=WAV decoding failed: only PCM (format 1), 1-2 channels, 8/16-bit are supported
OGG\ 解码失败：文件损坏、非\ Vorbis\ 流或缺少\ STB\ natives=OGG decoding failed: the file is invalid, is not a Vorbis stream or STB natives are missing
