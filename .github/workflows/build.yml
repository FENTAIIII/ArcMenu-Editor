name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: ./gradlew clean build -Pminecraft_version=${{ matrix.minecraft }} --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: ArcMenu-Editor-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
